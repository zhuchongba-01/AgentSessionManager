name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release versions
        run: pnpm version:check
      - name: Test release version tooling
        run: pnpm test:version
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Check frontend formatting
        run: pnpm format:check
      - name: Test frontend
        run: pnpm test:unit
      - name: Build frontend
        run: pnpm build:renderer
      # rustup reads the pinned toolchain and components from rust-toolchain.toml.
      - name: Prepare Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build Linux packages
        run: pnpm build:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: agent-session-manager-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
