[package]
name = "agent-session-manager"
version = "1.3.20"
description = "Standalone local session manager for coding agents"
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agent_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# protocol-asset 未使用：应用不通过 asset 协议读取文件（tauri.conf.json 里的
# assetProtocol 开关与空 scope 已一并移除）
tauri = { version = "2.8.2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
dirs = "5.0"
toml_edit = "0.22"
regex = "1.10"
# 只用 open/query/transaction：backup 与 hooks 没有任何调用，不再启用。
# bundled 必须保留，因为 CI 未安装系统 SQLite 开发包。
rusqlite = { version = "0.31", features = ["bundled"] }
json5 = "0.4"
sys-locale = "0.3"
tempfile = "3"
tauri-plugin-opener = "2"
zstd = "0.13"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Optimize release binary size
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
